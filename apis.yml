name: Cylib
description: >-
  Cylib is a German battery recycling company founded in 2022 as a spinoff from
  RWTH Aachen University, headquartered in Aachen, Germany. It transforms
  end-of-life lithium-ion batteries, production scrap, and black mass back into
  critical raw materials, recovering lithium, graphite, nickel, cobalt, and
  manganese through a proprietary, largely water-based hydrometallurgical process
  that the company reports achieves over 90% recycling efficiency with an ~80%
  reduced carbon footprint versus primary extraction, powered by 100% renewable
  electricity. The company is backed by Speedinvest and other investors. Cylib
  operates as an industrial cleantech / circular-economy materials business and
  does not currently publish a developer program, public API, developer portal,
  SDKs, or other software integration surface; this profile was added to the API
  Evangelist network as a portfolio-lead stub and carries only identity and
  public web properties.
